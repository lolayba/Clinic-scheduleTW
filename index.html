<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>心臟科門診週表</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent
    }

    /* body 基礎字級：隨螢幕寬度動態調整 */
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      background: #0f1923;
      color: #e0eaf5;
      font-size: clamp(14px, 1.2vw, 17px);
      line-height: 1.5
    }

    nav {
      background: #0f1923;
      border-bottom: 1px solid #263548;
      position: sticky;
      top: 0;
      z-index: 99;
      padding: 12px 12px 0
    }

    nav h1 {
      font-size: clamp(18px, 2vw, 22px);
      font-weight: 800;
      color: #00bcd4;
      margin-bottom: 10px
    }

    .tabs {
      display: flex;
      overflow-x: auto;
      gap: 6px;
      scrollbar-width: none;
      padding-bottom: 2px
    }

    .tabs::-webkit-scrollbar {
      display: none
    }

    .tab {
      flex-shrink: 0;
      padding: 10px 16px;
      font-size: clamp(14px, 1.5vw, 16px);
      font-weight: 700;
      color: #7a95b0;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      cursor: pointer;
      white-space: nowrap
    }

    .tab.on {
      color: #00bcd4;
      border-bottom-color: #00bcd4
    }

    .page {
      display: none;
      padding: 14px 10px 80px
    }

    .page.on {
      display: block
    }

    .infobar {
      background: #1a2636;
      border: 1px solid #263548;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center
    }

    .infobar a {
      color: #00bcd4;
      border: 1px solid #00bcd4;
      border-radius: 4px;
      padding: 3px 9px;
      text-decoration: none;
      font-weight: 700;
      font-size: clamp(12px, 1.2vw, 14px)
    }

    .note {
      font-size: clamp(11px, 1.1vw, 13px);
      color: #7a95b0;
      flex: 1;
      text-align: right
    }

    .dept {
      margin-top: 20px
    }

    .dept-title {
      font-size: clamp(13px, 1.3vw, 15px);
      font-weight: 800;
      color: #00bcd4;
      letter-spacing: .08em;
      padding-left: 10px;
      border-left: 4px solid #00bcd4;
      margin-bottom: 10px
    }

    .dr-card {
      background: #1a2636;
      border: 1px solid #263548;
      border-radius: 10px;
      margin-bottom: 12px;
      overflow: hidden
    }

    .dr-header {
      padding: 12px 14px 8px;
      border-bottom: 1px solid #263548
    }

    .dr-name {
      font-size: clamp(16px, 1.8vw, 19px);
      font-weight: 800;
      color: #ffffff
    }

    .dr-sub {
      font-size: clamp(11px, 1.2vw, 13px);
      color: #8ca8c4;
      margin-top: 4px;
      line-height: 1.4
    }

    .dr-body {
      display: grid;
      grid-template-columns: repeat(6, 1fr)
    }

    .day-col {
      border-right: 1px solid #1e2d3a;
      text-align: center
    }

    .day-col:last-child {
      border-right: none
    }

    .day-col.tod {
      background: #1e3550
    }

    .day-head {
      font-size: clamp(11px, 1.2vw, 13px);
      font-weight: 700;
      color: #7a95b0;
      padding: 6px 2px;
      border-bottom: 1px solid #1e2d3a
    }

    .day-head.tod {
      color: #00bcd4
    }

    .sess-row {
      padding: 6px 2px;
      border-bottom: 1px solid #1a2535;
      min-height: 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px
    }

    .sess-row:last-child {
      border-bottom: none
    }

    .sess-row.editable {
      cursor: pointer
    }

    .sess-row.editable:active {
      background: #263548
    }

    .s-tag {
      font-size: clamp(10px, 1vw, 12px);
      font-weight: 700;
      border-radius: 3px;
      padding: 1px 4px
    }

    .s-am {
      background: #162d47;
      color: #6ab0f5
    }

    .s-pm {
      background: #352500;
      color: #f5a623
    }

    .s-eve {
      background: #0d2318;
      color: #4cde80
    }

    .status {
      font-size: clamp(12px, 1.2vw, 14px);
      font-weight: 800
    }

    .status.has {
      color: #4caf50
    }

    .status.off {
      color: #f44336
    }

    .status.none {
      color: #3e546a
    }

    .status.echo {
      color: #ab47bc
    }

    .status.cath {
      color: #29b6f6
    }

    .status.op {
      color: #ff7043
    }

    .status.dnd {
      color: #ef5350
    }

    .status.ok {
      color: #66bb6a
    }

    .loc {
      font-size: clamp(10px, 1vw, 12px);
      color: #92aebd;
      line-height: 1.2;
      font-weight: 500
    }

    /* 鎖定與功能按鈕 */
    .lock-btn {
      position: fixed;
      bottom: 20px;
      right: 16px;
      background: #1a2636;
      border: 1px solid #263548;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      font-size: 22px;
      cursor: pointer;
      z-index: 98;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .4)
    }

    .lock-btn.unlocked {
      border-color: #00bcd4;
      background: #0d2530
    }

    .export-btn {
      position: fixed;
      bottom: 20px;
      right: 72px;
      background: #00bcd4;
      border: none;
      border-radius: 24px;
      height: 48px;
      padding: 0 18px;
      font-size: 14px;
      font-weight: 800;
      color: #000;
      cursor: pointer;
      z-index: 98;
      display: none;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .4)
    }

    .export-btn.show {
      display: flex
    }

    /* Overlay 彈窗通用 */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .75);
      z-index: 200
    }

    .overlay.on {
      display: flex;
      align-items: flex-end;
      justify-content: center
    }

    .panel {
      background: #1a2636;
      border-radius: 16px 16px 0 0;
      width: 100%;
      max-width: 480px;
      padding: 20px 20px 40px;
      border-top: 1px solid #263548
    }

    .panel h3 {
      font-size: 16px;
      font-weight: 800;
      color: #00bcd4;
      margin-bottom: 16px
    }

    .field {
      margin-bottom: 14px
    }

    .field label {
      display: block;
      font-size: 12px;
      color: #7a95b0;
      margin-bottom: 4px
    }

    .field select,
    .field input {
      width: 100%;
      background: #263548;
      border: 1px solid #3a506a;
      border-radius: 8px;
      color: #e0eaf5;
      padding: 10px 12px;
      font-size: 15px;
      outline: none
    }

    .field .info-val {
      background: #0f1923;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 14px;
      font-weight: 700
    }

    .btns {
      display: flex;
      gap: 8px;
      margin-top: 20px
    }

    .btn {
      flex: 1;
      padding: 13px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer
    }

    .btn-ok {
      background: #00bcd4;
      color: #000
    }

    .btn-no {
      background: #263548;
      color: #7a95b0
    }

    .err {
      color: #f44336;
      font-size: 13px;
      margin-top: 6px;
      display: none
    }
  </style>
</head>

    // ── 密碼功能 ──────────────────────────────
    function toggleLock() {
      if (unlocked) { lock(); }
      else { document.getElementById('pwdOvl').classList.add('on'); setTimeout(function () { document.getElementById('pwdInput').focus(); }, 100); }
    }
    function checkPwd() {
      var val = document.getElementById('pwdInput').value;
      if (val === PASSWORD) {
        unlocked = true;
        document.getElementById('pwdInput').value = '';
        document.getElementById('pwdErr').style.display = 'none';
        document.getElementById('pwdOvl').classList.remove('on');
        document.getElementById('lockBtn').textContent = '🔓';
        document.getElementById('lockBtn').classList.add('unlocked');
        document.getElementById('exportBtn').classList.add('show');
        renderAll();
      } else {
        document.getElementById('pwdErr').style.display = 'block';
        document.getElementById('pwdInput').value = '';
        document.getElementById('pwdInput').focus();
      }
    }
    function closePwd() {
      document.getElementById('pwdOvl').classList.remove('on');
      document.getElementById('pwdInput').value = '';
      document.getElementById('pwdErr').style.display = 'none';
    }
    function lock() {
      unlocked = false;
      document.getElementById('lockBtn').textContent = '🔒';
      document.getElementById('lockBtn').classList.remove('unlocked');
      document.getElementById('exportBtn').classList.remove('show');
      renderAll();
    }

    function exportHtml() {
      var dataStr = JSON.stringify(DATA, null, 1);
      var html = document.documentElement.outerHTML;
      var newHtml = html.replace(
        /var DATA=\[[\s\S]*?\];(\s*\/\/ ── 密碼功能)/,
        'var DATA=' + dataStr + ';\n$1'
      );
      var blob = new Blob([newHtml], { type: 'text/html;charset=utf-8' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'index.html';
      a.click();
      URL.revokeObjectURL(a.href);
    }

    // ── 渲染 ──────────────────────────────────
    function renderAll() {
      var tabs = document.getElementById('TABS');
      var root = document.getElementById('ROOT');
      var activeId = null;
      var activeTab = document.querySelector('.tab.on');
      if (activeTab) activeId = activeTab.getAttribute('data-id');
      tabs.innerHTML = '';
      root.innerHTML = '';

      DATA.forEach(function (hosp, hi) {
        var isActive = (activeId ? activeId === hosp.id : hi === 0);
        var btn = document.createElement('button');
        btn.className = 'tab' + (isActive ? ' on' : '');
        btn.textContent = hosp.name;
        btn.setAttribute('data-id', hosp.id);
        btn.onclick = function () {
          document.querySelectorAll('.tab').forEach(function (t) { t.classList.remove('on') });
          document.querySelectorAll('.page').forEach(function (p) { p.classList.remove('on') });
          btn.classList.add('on');
          document.getElementById('P' + hi).classList.add('on');
        };
        tabs.appendChild(btn);

        var page = document.createElement('div');
        page.className = 'page' + (isActive ? ' on' : '');
        page.id = 'P' + hi;

        var ib = '<div class="infobar">';
        hosp.links.forEach(function (l) { ib += '<a href="' + l.u + '" target="_blank">' + l.t + '</a>'; });
        ib += '<span class="note">' + hosp.note + '</span></div>';
        page.innerHTML = ib;

        hosp.depts.forEach(function (dept, di) {
          var dDiv = document.createElement('div');
          dDiv.className = 'dept';
          dDiv.innerHTML = '<div class="dept-title">' + dept.name + '</div>';
          dept.drs.forEach(function (dr, dri) {
            var card = document.createElement('div');
            card.className = 'dr-card';
            var hdr = '<div class="dr-header"><div class="dr-name">' + dr.n + '</div>';
            if (dr.sub) hdr += '<div class="dr-sub">' + dr.sub + '</div>';
            hdr += '</div>';
            var body = '<div class="dr-body">';
            for (var d = 0; d < 6; d++) {
              var tod = d === todayIdx;
              body += '<div class="day-col' + (tod ? ' tod' : '') + '"><div class="day-head' + (tod ? ' tod' : '') + '">' + DAYS[d] + '</div>';
              for (var si = 0; si < 3; si++) {
                var cell = dr.s[d][SK[si]];
                var v = gv(cell), loc = gl(cell);
                var stCls = v === 'has' ? 'has' : v === 'off' ? 'off' : v === 'echo' ? 'echo' : v === 'cath' ? 'cath' : v === 'op' ? 'op' : v === 'dnd' ? 'dnd' : v === 'ok' ? 'ok' : 'none';
                var stTxt = v === 'has' ? '有診' : v === 'off' ? '休診' : v === 'echo' ? '超音波' : v === 'cath' ? '導管室' : v === 'op' ? '手術' : v === 'dnd' ? '勿擾' : v === 'ok' ? '可擾' : '—';
                var locTxt = loc ? '<div class="loc">' + loc + '</div>' : '';
                var editAttr = unlocked ? (' onclick="openEdit(' + hi + ',' + di + ',' + dri + ',' + d + ',' + si + ')"') : '';
                var editCls = unlocked ? ' editable' : '';
                body += '<div class="sess-row' + editCls + '"' + editAttr + '>'
                  + '<span class="s-tag ' + SC[si] + '">' + SL[si] + '</span>'
                  + '<span class="status ' + stCls + '">' + stTxt + '</span>'
                  + locTxt + '</div>';
              }
              body += '</div>';
            }
            body += '</div>';
            card.innerHTML = hdr + body;
            dDiv.appendChild(card);
          });
          page.appendChild(dDiv);
        });
        root.appendChild(page);
      });
    }

    // ── 編輯 ──────────────────────────────────
    var ctx = null;
    function openEdit(hi, di, dri, d, si) {
      if (!unlocked) return;
      ctx = { hi: hi, di: di, dri: dri, d: d, si: si };
      var dr = DATA[hi].depts[di].drs[dri];
      var cell = dr.s[d][SK[si]];
      document.getElementById('E_DR').textContent = dr.n;
      document.getElementById('E_TIME').textContent = DAYS[d] + ' ' + ['早診', '午診', '夜診'][si];
      document.getElementById('E_ST').value = gv(cell) || 'none';
      document.getElementById('E_LOC').value = gl(cell) || '';
